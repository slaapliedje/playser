# Playser Flatpak. Media modules follow Flathub's io.mpv.Mpv manifest,
# trimmed to playback (no encoders, scripting or network extras).
#
#   flatpak-builder --user --install --force-clean build/flatpak \
#       flatpak/io.github.slaapliedje.Playser.yml
#
# HDR under gamescope also needs org.freedesktop.Platform.VulkanLayer.gamescope
# on the runtime's freedesktop branch (25.08 for KDE 6.11), see
# docs/spike-results.md 0c.
id: io.github.slaapliedje.Playser
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
# Java 21 for Blu-ray BD-J menus: libbluray needs a SecurityManager (gone in
# Java 24) and a full JRE (it forces AWT on); docs/spike-results.md 0e
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: playser

finish-args:
  - --share=ipc
  - --share=network                       # MakeMKV: version check, SDF/key downloads
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0:ro
  - --device=all                        # /dev/sr*, GPU, gamepads
  - --system-talk-name=org.freedesktop.UDisks2
  - --filesystem=/run/media:ro              # discs read through a mount when the device can't be; SD cards and USB drives (file browser)
  - --filesystem=/media:ro                  # USB drives on desktops (file browser)
  - --filesystem=home:ro                    # the user's videos (file browser)
  - --talk-name=org.freedesktop.ScreenSaver   # inhibit during playback
  # gamescope's Vulkan WSI layer talks to gamescope over this socket; without
  # it HDR swapchains fail ("Hooking has failed somewhere!")
  - --filesystem=xdg-run/gamescope-0
  - --env=LC_NUMERIC=C
  - --env=JAVA_HOME=/app/jre              # libbluray's BD-J
  - --filesystem=~/.MakeMKV:create         # MakeMKV's key and data (user's own)
  # an installed MakeMKV Flatpak is preferred over the bundled copy, so its
  # updates apply without rebuilding this app (see setupDecryption())
  - --filesystem=~/.local/share/flatpak/app/com.makemkv.MakeMKV:ro
  - --filesystem=/var/lib/flatpak/app/com.makemkv.MakeMKV:ro
  # audio passthrough (opt-in, setup screen): a rule keeping SteamOS's silent
  # speech-dispatcher stream off the output, which passthrough needs to itself
  - --filesystem=xdg-config/pipewire/pipewire-pulse.conf.d:create

cleanup:
  - '*.la'
  - '*.a'
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc

modules:
  - name: libdvdread
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdread/7.1.1/libdvdread-7.1.1.tar.xz
        sha256: a0d47876548bec806774bbf8dbf20bb19ba139464383156b32eb8e59915b90a9

  - name: libdvdnav
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdnav/7.0.0/libdvdnav-7.0.0.tar.xz
        sha256: a2a18f5ad36d133c74bf9106b6445806fa253b09141a46392550394b647b221e

  # also shipped by Flathub's io.mpv.Mpv
  - name: libdvdcss
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.videolan.org/pub/libdvdcss/1.6.0/libdvdcss-1.6.0.tar.xz
        sha256: 7ea556c846b7bfc32d47b41cae56d1863a6b6d5f706bb162778d6f298490977c

  # The JRE for BD-J menus: just the modules libbluray and disc applications
  # use (BD-J is Java ME PBP 1.1: java.awt/beans, java.rmi, ...); 53 MB, the
  # extension's whole JRE is ~200 MB
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/bin/jlink --output /app/jre --strip-debug --no-header-files --no-man-pages --compress=zip-6
        --add-modules java.base,java.desktop,java.logging,java.naming,java.management,java.rmi,java.xml,jdk.unsupported

  # AACS/BD+ come from the user's MakeMKV (libmmbd) at runtime; the BD-J jar
  # is built with the extension's JDK and Ant
  - name: libbluray
    buildsystem: meson
    build-options:
      append-path: /usr/lib/sdk/openjdk21/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk21/jvm/openjdk-21
    config-opts:
      - -Dbdj_jar=enabled
      - -Djdk_home=/usr/lib/sdk/openjdk21/jvm/openjdk-21
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libbluray/1.5.0/libbluray-1.5.0.tar.xz
        sha256: f676408e91a5d321abf8b8d4dfdae36205c297dab5c54c3ec519639025f474a2
      # BD-J on a 3D player: graphics and background configurations are
      # the S3D classes, which discs cast to (Warner's 3D menus crash on a
      # ClassCastException and never show)
      - type: patch
        path: patches/libbluray-s3d-configurations.patch

  - name: libass
    config-opts:
      - --disable-static
      - --enable-asm
      - --enable-harfbuzz
      - --enable-fontconfig
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d

  # MakeMKV, for Blu-ray/UHD decryption through libmmbd (libbluray loads it
  # as libaacs/libbdplus; it drives makemkvcon). Users supply their own key,
  # kept in ~/.MakeMKV. Modules follow Flathub's com.makemkv.MakeMKV.
  # Built before our FFmpeg module: makemkv-oss 2.0.0 doesn't compile against
  # FFmpeg 9, so it uses the runtime's FFmpeg (libavcodec.so.61) instead.
  - name: makemkv-oss         # LGPL: libmmbd, libmakemkv, libdriveio
    buildsystem: autotools
    build-options:
      cflags: -D__GNU_SOURCE -D__STDC_CONSTANT_MACROS -D__STDC_LIMIT_MACROS -D __STDC_FORMAT_MACROS
    config-opts:
      - --disable-gui
    make-install-args:
      - DESTDIR=/             # avoids its ldconfig call
    post-install:
      - install -Dp -m 644 License.txt /app/share/licenses/playser/makemkv-oss-License.txt
    sources:
      - type: archive
        url: https://www.makemkv.com/download/makemkv-oss-2.0.0.tar.gz
        sha256: 435316b2d219eb48c880526557addd076b5f5e6de5171424c7651f9cac95b161

  # proprietary makemkvcon; the author allows redistribution as long as the
  # EULA is referenced (Flathub precedent: com.makemkv.MakeMKV)
  - name: makemkv-bin
    buildsystem: simple
    build-commands:
      - mkdir -p tmp
      - echo accepted > tmp/eula_accepted
      - make install DESTDIR=/ PREFIX=/app
      - install -Dp -m 644 src/eula_en_linux.txt /app/share/licenses/playser/makemkv-eula.txt
    sources:
      - type: archive
        url: https://www.makemkv.com/download/makemkv-bin-2.0.0.tar.gz
        sha256: f1265e74875a186efdfbbbec7459a64e969033515e53cbc4d805f0a374f0a124

  # 3D Blu-ray: decodes H.264 MVC (both eyes) for FFmpeg's libedge264mvc
  # decoder (our patch). BSD-3-Clause. Built for any x86-64, with SSE4/AVX2/
  # AVX-512 code picked at run time.
  - name: edge264mvc
    buildsystem: simple
    build-commands:
      # install relinks the library, so it needs the same settings
      - make -j${FLATPAK_BUILDER_N_JOBS} CFLAGS="-march=x86-64 -mtune=generic" VARIANTS=x86-64-v2,x86-64-v3,x86-64-v4 BUILDTEST=no PREFIX=/app install
      - install -Dp -m 644 LICENSE_BSD.txt /app/share/licenses/playser/EDGE264MVC-LICENSE
    sources:
      - type: git
        url: https://github.com/jens-duttke/edge264-mvc.git
        commit: 4555276ce692ee8abdb8f768d4e59f82b1f6590e

  - name: ffmpeg
    cleanup:
      - /bin
      - /share/ffmpeg
    config-opts:
      - --disable-debug
      - --disable-doc
      - --disable-static
      - --disable-programs
      - --disable-encoders
      - --enable-encoder=png,mjpeg   # mpv screenshots
      - --disable-muxers
      - --enable-muxer=spdif         # mpv audio passthrough (audio-spdif)
      - --enable-gpl
      - --enable-version3
      - --enable-shared
      - --enable-gnutls
      - --enable-libass
      - --enable-libdav1d
      - --enable-libfreetype
      - --enable-libdrm
      - --enable-vaapi
      - --enable-vulkan
      - --enable-libbluray
      - --enable-libedge264mvc       # 3D Blu-ray (patch below)
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n9.0.2
        commit: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
      # libedge264mvc: both eyes of a 3D Blu-ray as one side-by-side frame
      - type: patch
        path: patches/ffmpeg-libedge264mvc.patch

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=enabled
      - -Dshaderc=enabled
      - -Ddemos=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.387.0
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65

  # mpv's X11 backend (gamescope runs it under Xwayland)
  - name: libXpresent
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxpresent.git
        tag: libXpresent-1.0.2
        commit: 4d92149372461bf575e8a09b1064a2884c38c3aa

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dwerror=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Ddvdnav=enabled
      - -Dlibbluray=enabled
      - -Dvulkan=enabled
      - -Dvaapi=enabled
      - -Dwayland=enabled
      - -Dx11=enabled
      - -Dpipewire=enabled
      - -Dpulse=enabled
      - -Dlcms2=enabled
      - -Dzimg=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413
      # passthrough survives starting mid-stream (resume, seek): a packet the
      # spdif muxer rejects is dropped instead of failing the decoder
      - type: patch
        path: patches/mpv-spdif-drop-bad-packets.patch
      # overlay-colorspace=display: the UI overlay is composited as given,
      # encoded by the app for the display (no tone mapping over HDR video
      # on an SDR screen)
      - type: patch
        path: patches/mpv-overlay-display-colorspace.patch

  # DVD menus (ours, LGPL; static, used by the app)
  - name: libdiscnav
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: ../libdiscnav

  - name: playser
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: dir
        path: ../app
      - type: file
        path: ../COPYING
